<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة البوتات</title>
<style>
body{margin:0;font-family:sans-serif;background:#f4f6f5;padding-bottom:70px}
.card{background:#fff;border-radius:16px;margin:12px;padding:14px;box-shadow:0 1px 4px #0001}
.h{display:flex;justify-content:space-between;align-items:center}
.n{background:#e3f4ec;color:#1b8a5a;border-radius:10px;padding:10px 12px;font-weight:bold}
.st{padding:6px 12px;border-radius:20px;font-size:14px}.on{background:#e3f4ec;color:#1b8a5a}.off{background:#fdeaea;color:#c33}
.info{background:#f8f9f9;border-radius:10px;padding:10px;margin:10px 0;font-size:13px;color:#555}
.b{display:flex;gap:6px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 12px;font-size:14px;background:#e8ecf8;color:#234}
.g{background:#6fbfa0;color:#fff}.w{background:#fff;border:1px solid #ccc}
pre{background:#111;color:#0f0;font-size:11px;padding:8px;max-height:220px;overflow:auto;white-space:pre-wrap}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd}
nav div{flex:1;text-align:center;padding:14px;color:#888}nav .a{color:#1b8a5a;font-weight:bold}
</style></head><body>
<div id="view"></div>
<nav><div id="t0" class="a" onclick="tab(0)">الرئيسية</div><div id="t1" onclick="tab(1)">السجل</div><div id="t2" onclick="tab(2)">الربط</div></nav>
<script>
var P=localStorage.pp||prompt("كلمة السر"),T=0,D=[],E=[],op={};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function ago(t){if(!t)return"—";var s=Math.floor((Date.now()-t)/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+" يوم ":"")+(h?h+" س ":"")+m+" د"}
function api(u,m,b){return fetch(u,{method:m||"GET",headers:{Authorization:P},body:b}).then(function(r){if(r.status==401){localStorage.removeItem("pp");alert("كلمة سر خاطئة");location.reload();return}localStorage.pp=P;return r.json()})}
function R(){var h="";
if(T==0)D.forEach(function(b,i){h+=`<div class="card"><div class="h"><div class="n">${b.n}</div><b>البوت ${b.n}</b><span class="st ${b.on?"on":"off"}">● ${b.on?"يعمل":"متوقف"}</span></div>
<div class="info">مدة التشغيل: ${b.on?ago(b.since):"—"}<br>آخر إيقاف من اللوحة: ${b.stopped?"منذ "+ago(b.stopped):"—"}${b.until?"<br>يتوقف بعد: "+Math.max(0,Math.ceil((b.until-Date.now())/60000))+" د":""}</div>
<div class="b"><button class="g" onclick="a(${i},'start')">▶ تشغيل</button><button class="w" onclick="a(${i},'stop')">■ إيقاف</button><button onclick="a(${i},'restart')">↻ إعادة تشغيل</button><button onclick="tm(${i})">⏱ تشغيل بمدة</button></div>
<p onclick="op[${i}]=!op[${i}];R()" style="color:#888;font-size:13px">سجل البوت ⌄</p>${op[i]?"<pre>"+esc(b.logs.join("\n"))+"</pre>":""}</div>`});
if(T==1)h='<div class="card"><pre>'+esc(E.join("\n"))+'</pre></div>';
if(T==2)h='<div class="card">'+D.map(function(b){return "البوت "+b.n+" ← "+b.dir}).join("<br><br>")+'<p style="color:#888">أي مجلد اسمه acc1 أو acc2 أو acc3... وفيه index.js يُضاف تلقائياً.</p></div>';
document.getElementById("view").innerHTML=h}
function tab(n){T=n;for(var i=0;i<3;i++)document.getElementById("t"+i).className=i==n?"a":"";R()}
function L(){Promise.all([api("/api/bots"),api("/api/events")]).then(function(r){D=r[0]||[];E=r[1]||[];R()})}
function a(i,x){api("/api/bots/"+D[i].id+"/"+x,"POST").then(L)}
function tm(i){var m=prompt("كم دقيقة؟");if(m&&+m>0)api("/api/bots/"+D[i].id+"/timed","POST",m).then(L)}
setInterval(L,3000);L();
</script></body></html>
